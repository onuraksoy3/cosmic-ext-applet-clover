[package]
name = "clover-corners"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Hot corners for COSMIC: invisible layer-shell corners that run an action, with a built-in Show Desktop"

[dependencies]
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d", default-features = false, features = ["client"] }
