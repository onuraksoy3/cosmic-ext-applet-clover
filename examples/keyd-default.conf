# /etc/keyd/default.conf — companion config for the Clover COSMIC applet.
# Clover changes bindings at runtime (keyd bind); this file defines the layers
# it relies on and the defaults that apply before the applet starts.

[ids]
*

[main]
# Left ⌘: hold = cmd layer (Ctrl-like), tap = Super. Clover rebinds this line.
leftmeta = overload(cmd, leftmeta)
# Left ⌥: Alt, with Mac word-jump overrides below.
leftalt = layer(opt)
# F3 / F4 keycaps (media mode): Mission Control -> workspaces, Launchpad -> app library
scale = M-w
dashboard = M-a
# F5+F6 together (both keyboard-backlight keys): toggle Clover's auto screen brightness
kbdillumdown+kbdillumup = M-A-f5

[cmd:C]
# Hold Alt while ⌘ stays down, so COSMIC's switcher commits on ⌘ release (not instantly).
tab = swapm(app_switch, A-tab)
space = M-/
q = M-q
# Mac text editing
left = home
right = end
up = C-home
down = C-end
backspace = delete
# Mac navigation / windows
[ = A-left
] = A-right
m = M-m
h = M-A-h

# Entered from ⌘Tab: Alt is held, Tab cycles, releasing ⌘ switches.
[app_switch:A]
tab = A-tab
grave = A-grave

[cmd+shift]
[ = C-pageup
] = C-pagedown
3 = M-A-3
4 = M-A-4
5 = M-A-5
backspace = M-A-backspace

[cmd+control]
f = M-f11
space = M-A-space

[cmd+shift+control]
3 = M-A-S-3
4 = M-A-S-4

# Same chords when left Ctrl has been turned into Super ("Left Ctrl acts as Super").
[cmd+meta]
f = M-f11
space = M-A-space

[opt:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[cmd+opt]
d = M-A-d
